<title>Plan de Marcas INVIMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#F2F5F1;--surface:#FFFFFF;--surface2:#E8EEEA;--ink:#10201A;--muted:#5C6E66;--line:#D5DFDA;
  --accent:#0A7A5F;--accent-soft:#D7EEE6;--accent-ink:#FFFFFF;--mark:#E3F26B;--mark-ink:#1E2600;
  --up:#0F7A50;--up-bg:#DBF2E5;--flat:#2B5A8A;--flat-bg:#E1EBF6;--down:#8F5A00;--down-bg:#FBEDCB;
  --burn:#B42318;--burn-bg:#FDE2DF;--new:#6A3DBB;--new-bg:#ECE4FA;--shadow:0 1px 2px rgba(16,32,26,.06),0 8px 24px rgba(16,32,26,.06);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;--body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0C1411;--surface:#131E1A;--surface2:#1A2823;--ink:#E6EEEA;--muted:#94A69F;--line:#26362F;
  --accent:#3CCB9E;--accent-soft:#163A2F;--accent-ink:#06231B;--mark:#D6EA57;--mark-ink:#1A2100;
  --up:#56D69E;--up-bg:#123325;--flat:#86B6EC;--flat-bg:#15263A;--down:#F2B748;--down-bg:#33270F;--burn:#FF8A80;--burn-bg:#3A1714;--new:#B99DFF;--new-bg:#241A3A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0C1411;--surface:#131E1A;--surface2:#1A2823;--ink:#E6EEEA;--muted:#94A69F;--line:#26362F;
  --accent:#3CCB9E;--accent-soft:#163A2F;--accent-ink:#06231B;--mark:#D6EA57;--mark-ink:#1A2100;
  --up:#56D69E;--up-bg:#123325;--flat:#86B6EC;--flat-bg:#15263A;--down:#F2B748;--down-bg:#33270F;--burn:#FF8A80;--burn-bg:#3A1714;--new:#B99DFF;--new-bg:#241A3A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.015em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,4vw,40px)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font:600 12px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:64px}
.logo{display:flex;align-items:center;gap:10px;font:800 18px/1 var(--display);white-space:nowrap}
.logo i{width:30px;height:16px;border-radius:99px;background:linear-gradient(90deg,var(--accent) 50%,var(--mark) 50%);display:inline-block;transform:rotate(-20deg)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:9px 14px;border-radius:99px;font-weight:600;font-size:15px;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}
.tab:hover{color:var(--ink);background:var(--surface2)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}

main{padding-block:32px 80px}
.view{animation:entra .45s cubic-bezier(.2,.7,.2,1)}
@keyframes entra{from{opacity:.25;transform:translateY(10px)}to{opacity:1;transform:none}}
.stag>*{animation:entra .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*40ms)}

/* inicio */
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:40px;align-items:end;padding-block:24px 36px}
.hero h1{font-size:clamp(38px,6.2vw,76px);font-weight:800}
.hero h1 mark{background:var(--mark);color:var(--mark-ink);padding:0 .12em;border-radius:.12em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hero .lead{font-size:clamp(17px,1.6vw,20px);color:var(--muted);max-width:38ch;margin-top:18px}
.stamp{justify-self:end;width:min(100%,300px);aspect-ratio:1.45;border:2px dashed var(--accent);border-radius:18px;padding:18px;display:grid;align-content:space-between;transform:rotate(-3deg);color:var(--accent);background:var(--accent-soft)}
.stamp b{font:800 26px/1 var(--display)}
.stamp span{font:700 13px/1.3 var(--mono);letter-spacing:.04em}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi{padding:22px 18px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
.kpi .v{font:800 clamp(30px,4vw,46px)/1 var(--display);letter-spacing:-.02em}
.kpi .l{color:var(--muted);font-size:14px;margin-top:8px}
.sec{margin-top:64px}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.sec-h h2{font-size:clamp(26px,3vw,36px)}
.sec-h p{color:var(--muted);max-width:56ch}
.pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.paso{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.paso .n{font:700 13px/1 var(--mono);color:var(--accent)}
.paso h3{font-size:22px;margin:12px 0 8px}
.paso p{color:var(--muted);font-size:15px}
.barras{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.barra{display:grid;grid-template-columns:190px 1fr 92px;gap:14px;align-items:center;font-size:15px;border:0;background:none;text-align:left;padding:4px;border-radius:10px}
.barra:hover{background:var(--surface2)}
.barra .t{height:14px;background:var(--surface2);border-radius:99px;overflow:hidden}
.barra .t i{display:block;height:100%;background:var(--accent);border-radius:99px;width:var(--w);transform-origin:left;animation:crece .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*50ms)}
@keyframes crece{from{transform:scaleX(.08)}to{transform:none}}
.barra .num{text-align:right;color:var(--muted)}

/* chips y filtros */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.chip{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:99px;font-size:14px;font-weight:600;white-space:nowrap;transition:all .2s}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{font:600 12px var(--mono);opacity:.7;margin-left:4px}
.tend{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:13px;font-weight:700;white-space:nowrap}
.tend.sube{background:var(--up-bg);color:var(--up)}.tend.estable{background:var(--flat-bg);color:var(--flat)}
.tend.baja{background:var(--down-bg);color:var(--down)}.tend.quemado{background:var(--burn-bg);color:var(--burn)}
.tend.nuevo{background:var(--new-bg);color:var(--new)}.tend.sindato{background:var(--surface2);color:var(--muted)}
.ya{background:var(--mark);color:var(--mark-ink);font:800 12px/1 var(--mono);padding:6px 9px;border-radius:7px;letter-spacing:.06em}
.despues{background:var(--surface2);color:var(--muted);font:700 12px/1 var(--mono);padding:6px 9px;border-radius:7px;letter-spacing:.04em}
.pill{border:1px solid var(--line);padding:3px 10px;border-radius:99px;font-size:13px;color:var(--muted);white-space:nowrap}

/* tarjetas de registro */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.reg{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:14px;text-align:left;transition:transform .25s,box-shadow .25s,border-color .25s}
.reg:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.reg .fila{display:flex;justify-content:space-between;align-items:center;gap:8px}
.reg .fotos{display:flex}
.reg .fotos img{width:58px;height:58px;border-radius:14px;object-fit:cover;border:3px solid var(--surface);background:#fff;margin-right:-14px}
.reg h3{font-size:21px}
.reg .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mini{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted)}
.mini .t{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.mini .t i{display:block;height:100%;width:var(--w);border-radius:99px;background:var(--accent);transform-origin:left;animation:crece .8s both}
.mini .t i.mx{background:color-mix(in srgb,var(--accent) 45%,var(--mark))}
.cat-titulo{display:flex;align-items:center;gap:12px;margin:34px 0 14px}
.cat-titulo h3{font-size:24px}
.cat-titulo span{color:var(--muted);font-size:14px}

/* categorías */
.cat-head{display:grid;grid-template-columns:1.3fr .7fr;gap:28px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px;margin-top:18px}
.cat-head h2{font-size:clamp(30px,4vw,48px)}
.cat-head .prob{color:var(--muted);margin-top:12px;max-width:60ch}
.cat-head .stats{display:flex;gap:28px;margin-top:20px;flex-wrap:wrap}
.cat-head .stats b{display:block;font:800 28px/1 var(--display)}
.cat-head .stats span{font-size:13px;color:var(--muted)}
.prop{background:var(--accent-soft);border-radius:18px;padding:16px;display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center;border:0;text-align:left}
.prop:hover .mock{transform:rotate(-4deg) scale(1.04)}
.prop .mock{transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.prop .eyebrow{color:var(--accent)}
.prop h4{font-size:20px;margin:6px 0 4px}
.prop p{font-size:14px;color:var(--muted)}
.grupo{margin-top:30px}
.grupo-h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.grupo-h h3{font-size:20px}
.grupo-h span{color:var(--muted);font:600 13px var(--mono)}
.lista{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.item{display:grid;grid-template-columns:64px minmax(0,2.2fr) 70px minmax(110px,1fr) 118px minmax(0,1.3fr);gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item img{width:64px;height:64px;border-radius:12px;object-fit:cover;background:#fff}
.item .nom{font-weight:700;line-height:1.3}
.item .sub{font-size:13px;color:var(--muted);margin-top:2px}
.item .u{display:grid;gap:5px;font-size:13px}
.item .u .t{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden}
.item .u .t i{display:block;height:100%;width:var(--w);background:var(--accent);border-radius:99px}
.item .sale{font-size:13px;font-weight:600}
.item .sale.si{color:var(--accent)}
.item .sale.no{color:var(--muted);font-weight:500}
.item a{color:var(--muted);font-size:12px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer}
.toggle input{accent-color:var(--accent);width:18px;height:18px}

/* marcas */
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;text-align:left;display:grid;gap:12px;transition:transform .25s,box-shadow .25s}
.gcard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.gcard .mocks{display:flex;justify-content:center;gap:4px;height:150px;align-items:end;background:var(--surface2);border-radius:16px;padding:12px 8px 0;overflow:hidden}
.gcard .mocks svg{height:130px;width:auto;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.gcard:hover .mocks svg:nth-child(1){transform:translateY(-6px) rotate(-5deg)}
.gcard:hover .mocks svg:nth-child(2){transform:translateY(-10px)}
.gcard:hover .mocks svg:nth-child(3){transform:translateY(-6px) rotate(5deg)}
.gcard h3{font-size:22px}
.gcard .nombres{color:var(--muted);font-size:14px}
.detalle{display:grid;grid-template-columns:.9fr 1.1fr;gap:32px;margin-top:20px}
.escenario{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);align-self:start;background:radial-gradient(120% 90% at 50% 100%,var(--c2s,var(--surface2)) 0%,var(--surface) 70%);border:1px solid var(--line);border-radius:26px;padding:24px;display:grid;gap:18px;justify-items:center;overflow:hidden}
.escenario .grande{width:min(100%,300px);height:auto;filter:drop-shadow(0 18px 24px rgba(0,0,0,.18))}
.escenario .grande.anim{animation:aparece .55s cubic-bezier(.2,.8,.2,1.2)}
@keyframes aparece{from{transform:translateY(16px) rotate(-6deg) scale(.92);opacity:.3}to{transform:none;opacity:1}}
.selector{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.selector button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-weight:700;display:flex;gap:8px;align-items:center}
.selector button i{width:14px;height:14px;border-radius:50%;display:inline-block}
.selector button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.info{display:grid;gap:18px}
.info .nombre{font-size:clamp(40px,5.5vw,66px);font-weight:800}
.info .eslogan{font:600 clamp(18px,2vw,22px)/1.35 var(--display);color:var(--accent)}
.bloque{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.bloque h4{font:700 12px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.bloque ul{margin:0;padding-left:18px;display:grid;gap:6px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.nodecir{display:flex;flex-wrap:wrap;gap:8px}
.nodecir span{background:var(--burn-bg);color:var(--burn);padding:5px 11px;border-radius:99px;font-size:13px;font-weight:600;text-decoration:line-through;text-decoration-thickness:1.5px}
.precio{font:800 30px/1 var(--display)}
.volver{border:0;background:none;color:var(--muted);font-weight:600;padding:6px 0}
.volver:hover{color:var(--ink)}
.link{border:0;background:none;color:var(--accent);font-weight:700;padding:0;text-decoration:underline;text-underline-offset:3px}

/* modal */
dialog{border:0;padding:0;border-radius:24px;width:min(760px,calc(100% - 32px));max-height:calc(100% - 48px);background:var(--surface);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(8,16,13,.55);backdrop-filter:blur(3px)}
dialog[open]{animation:sube .35s cubic-bezier(.2,.8,.2,1)}
@keyframes sube{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.modal{padding:28px;display:grid;gap:20px}
.modal .cerrar{position:sticky;top:0;justify-self:end;border:1px solid var(--line);background:var(--surface);border-radius:99px;width:38px;height:38px;font-size:20px;line-height:1}
.modal h2{font-size:clamp(28px,4vw,40px)}
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ref{display:grid;gap:6px;font-size:13px}
.ref img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;background:#fff;border:1px solid var(--line)}
.ref b{font-size:14px;line-height:1.3}
.ref span{color:var(--muted)}
.nota{font-size:13px;color:var(--muted)}
footer{border-top:1px solid var(--line);padding-block:24px;color:var(--muted);font-size:13px}

@media (max-width:860px){
  .hero,.cat-head,.detalle{grid-template-columns:1fr}
  .stamp{justify-self:start}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(2){border-right:0}.kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .pasos{grid-template-columns:1fr}
  .barra{grid-template-columns:120px 1fr 70px;font-size:14px}
  .item{grid-template-columns:56px 1fr auto;grid-template-areas:"img nom nom" "img u tend" "sale sale sale"}
  .item img{grid-area:img;width:56px;height:56px}.item .n1{grid-area:nom}.item .u{grid-area:u}.item .tcol{grid-area:tend}.item .sale{grid-area:sale}.item .pais{display:none}
  .escenario{position:static}
  .dos{grid-template-columns:1fr}
  .logo span{display:none}
}
@media (max-width:440px){.kpis{grid-template-columns:1fr}.kpi{border-right:0;border-bottom:1px solid var(--line)}.kpi:last-child{border-bottom:0}.barra{grid-template-columns:1fr 64px}.barra .t{grid-column:1/-1;grid-row:2}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <div class="logo"><i aria-hidden="true"></i><span>Plan INVIMA</span></div>
    <nav class="tabs" role="tablist" aria-label="Secciones">
      <button class="tab" role="tab" data-tab="inicio" id="t-inicio">Inicio</button>
      <button class="tab" role="tab" data-tab="registros" id="t-registros">Registros</button>
      <button class="tab" role="tab" data-tab="categorias" id="t-categorias">Categorías</button>
      <button class="tab" role="tab" data-tab="marcas" id="t-marcas">Marcas propias</button>
    </nav>
  </div>
</header>
<main class="wrap" id="app" aria-live="polite"></main>
<footer class="wrap" id="pie"></footer>
<dialog id="modal" aria-labelledby="modal-titulo"></dialog>

<script>
const D = /*__DATA__*/null;
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => (n == null ? '—' : Number(n).toLocaleString('es-CO'));
const pais = (r) => (r === 'US' ? 'EE. UU.' : 'México');
const reducido = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TEND = { sube: '▲ Subiendo', estable: '● Estable', baja: '▼ Bajando', quemado: '✕ Quemado', nuevo: '✦ Nuevo', sindato: 'Sin dato' };
const tend = (t, c) => `<span class="tend ${t}" title="${c == null ? '' : 'Septiembre vs. agosto: ' + (c > 0 ? '+' : '') + Math.round(c) + ' %'}">${TEND[t]}${c != null && (t === 'sube' || t === 'baja' || t === 'quemado') ? ` <span class="mono">${c > 0 ? '+' : ''}${Math.round(c)}%</span>` : ''}</span>`;
const img = (id, alt = '') => (D.imgs[id] ? `<img src="${D.imgs[id]}" alt="${esc(alt)}" loading="lazy">` : `<img alt="">`);
const catNombre = (cod) => D.categorias.find((c) => c.cod === cod)?.n || cod;
const marcaDe = (cod) => D.marcas.find((m) => m.categoria === cod);
const regPorId = Object.fromEntries(D.registros.map((r) => [r.id, r]));
const prodPorId = Object.fromEntries(D.productos.map((p) => [p.id, p]));

const estado = { tab: 'inicio', orden: 'todos', cat: D.categorias[0].cod, sinQuemados: false, marcaCat: null, marcaIdx: 0 };
try { const g = JSON.parse(localStorage.getItem('planinvima') || '{}'); Object.assign(estado, { sinQuemados: !!g.sinQuemados }); } catch (e) {}
const guardar = () => { try { localStorage.setItem('planinvima', JSON.stringify({ sinQuemados: estado.sinQuemados })); } catch (e) {} };

/* ---------- empaques dibujados ---------- */
function tono(hex, f) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const m = (v) => Math.max(0, Math.min(255, Math.round(f < 0 ? v * (1 + f) : v + (255 - v) * f)));
  return '#' + [m(r), m(g), m(b)].map((v) => v.toString(16).padStart(2, '0')).join('');
}
function claro(hex) { const n = parseInt(hex.slice(1), 16); return ((n >> 16) * 299 + ((n >> 8) & 255) * 587 + (n & 255) * 114) / 1000 > 150; }
function texto(nombre, x, y, ancho, color, max = 30) {
  const pal = String(nombre).toUpperCase().split(' ').filter(Boolean);
  const una = (t, yy, tam, peso = 800, esp = 0.5) => `<text x="${x}" y="${yy}" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="${peso}" font-size="${tam.toFixed(1)}" fill="${color}" letter-spacing="${esp}">${esc(t)}</text>`;
  if (pal.length > 1 && pal.join(' ').length > 9) {
    const principal = pal[pal.length - 1], arriba = pal.slice(0, -1).join(' ');
    const fs = Math.max(11, Math.min(max, ancho / (principal.length * 0.62)));
    return una(arriba, y - fs * 0.92, Math.min(10, ancho / (arriba.length * 0.75)), 700, 2) + una(principal, y + 2, fs);
  }
  const t = pal.join(' ');
  return una(t, y, Math.max(11, Math.min(max, ancho / (t.length * 0.62))));
}

/* ---------- navegación ---------- */
function pintar(animar = true) {
  document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', t.dataset.tab === estado.tab));
  const app = $('#app');
  app.innerHTML = `<div class="view">${{ inicio: vistaInicio, registros: vistaRegistros, categorias: vistaCategorias, marcas: vistaMarcas }[estado.tab]()}</div>`;
  if (animar && !reducido) contar();
}
function ir(tab, extra = {}) {
  Object.assign(estado, extra, { tab });
  try { history.replaceState(null, '', '#' + tab); } catch (e) {}
  pintar();
  scrollTo({ top: 0, behavior: reducido ? 'auto' : 'smooth' });
}
function contar() {
  document.querySelectorAll('[data-cuenta]').forEach((el) => {
    const fin = +el.dataset.cuenta, ini = fin * 0.55, t0 = performance.now();
    const paso = (t) => { const k = Math.min(1, (t - t0) / 900); el.textContent = fmt(Math.round(ini + (fin - ini) * (1 - Math.pow(1 - k, 3)))); if (k < 1) requestAnimationFrame(paso); };
    requestAnimationFrame(paso);
  });
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('button, a'); if (!t) return;
  if (t.matches('[data-cerrar]')) return $('#modal').close();
  if (t.dataset.tab) return ir(t.dataset.tab);
  if (t.dataset.ir) return ir(t.dataset.ir);
  if (t.dataset.reg) { e.stopPropagation(); return abrirRegistro(t.dataset.reg); }
  if (t.dataset.orden) { estado.orden = t.dataset.orden; return pintar(false); }
  if (t.dataset.cat) return ir('categorias', { cat: t.dataset.cat });
  if (t.dataset.marca) { if ($('#modal').open) $('#modal').close(); return ir('marcas', { marcaCat: t.dataset.marca, marcaIdx: 0 }); }
  if (t.hasAttribute('data-volver')) return ir('marcas', { marcaCat: null });
  if (t.dataset.idx) { estado.marcaIdx = +t.dataset.idx; return pintar(false); }
});
document.addEventListener('change', (e) => { if (e.target.id === 'sin-quemados') { estado.sinQuemados = e.target.checked; guardar(); pintar(false); } });
$('#modal').addEventListener('click', (e) => { if (e.target === e.currentTarget) e.currentTarget.close(); });
const inicial = (location.hash || '').slice(1);
if (['inicio', 'registros', 'categorias', 'marcas'].includes(inicial)) estado.tab = inicial;
$('#pie').innerHTML = `Datos de ventas: FastMoss (TikTok Shop), ${esc(D.corte)}. La parte regulatoria es preliminar: validar con un asesor regulatorio antes de radicar. Marcas y empaques son propuestas ilustrativas.`;
pintar();
</script>
