<title>Plan de Marcas INVIMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Fredoka:wght@600;700&family=Playfair+Display:wght@700&family=Anton&family=Cormorant+Garamond:wght@700&family=Bebas+Neue&family=Pacifico&family=DM+Serif+Display&family=Archivo+Black&family=Quicksand:wght@700&family=Syne:wght@800&family=Righteous&family=Baloo+2:wght@800&family=Abril+Fatface&family=Montserrat:wght@800&display=swap">
<style>
:root{
  --bg:#F2F5F1;--surface:#FFFFFF;--surface2:#E8EEEA;--ink:#10201A;--muted:#5C6E66;--line:#D5DFDA;
  --accent:#0A7A5F;--accent-soft:#D7EEE6;--mark:#E3F26B;--mark-ink:#1E2600;
  --up:#0F7A50;--up-bg:#DBF2E5;--flat:#2B5A8A;--flat-bg:#E1EBF6;--down:#8F5A00;--down-bg:#FBEDCB;
  --burn:#B42318;--burn-bg:#FDE2DF;--new:#6A3DBB;--new-bg:#ECE4FA;--shadow:0 1px 2px rgba(16,32,26,.06),0 10px 28px rgba(16,32,26,.08);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;--body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0C1411;--surface:#131E1A;--surface2:#1A2823;--ink:#E6EEEA;--muted:#94A69F;--line:#26362F;
  --accent:#3CCB9E;--accent-soft:#163A2F;--mark:#D6EA57;--mark-ink:#1A2100;
  --up:#56D69E;--up-bg:#123325;--flat:#86B6EC;--flat-bg:#15263A;--down:#F2B748;--down-bg:#33270F;--burn:#FF8A80;--burn-bg:#3A1714;--new:#B99DFF;--new-bg:#241A3A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.28);}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0C1411;--surface:#131E1A;--surface2:#1A2823;--ink:#E6EEEA;--muted:#94A69F;--line:#26362F;
  --accent:#3CCB9E;--accent-soft:#163A2F;--mark:#D6EA57;--mark-ink:#1A2100;
  --up:#56D69E;--up-bg:#123325;--flat:#86B6EC;--flat-bg:#15263A;--down:#F2B748;--down-bg:#33270F;--burn:#FF8A80;--burn-bg:#3A1714;--new:#B99DFF;--new-bg:#241A3A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.28);}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.015em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,4vw,40px)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font:600 12px/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.nota{font-size:14px;color:var(--muted)}

/* barra */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:64px}
.logo{display:flex;align-items:center;gap:10px;font:800 18px/1 var(--display);white-space:nowrap}
.logo i{width:30px;height:16px;border-radius:99px;background:linear-gradient(90deg,var(--accent) 50%,var(--mark) 50%);display:inline-block;transform:rotate(-20deg)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:9px 14px;border-radius:99px;font-weight:600;font-size:15px;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}
.tab:hover{color:var(--ink);background:var(--surface2)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.guia-btn{border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:99px;padding:7px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.guia-btn:hover{background:var(--accent);color:var(--surface)}

main{padding-block:28px 80px}
.view{animation:entra .45s cubic-bezier(.2,.7,.2,1)}
@keyframes entra{from{opacity:.25;transform:translateY(10px)}to{opacity:1;transform:none}}
.stag>*{animation:entra .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(min(var(--i,0),12)*35ms)}

/* fotos ampliables */
.foto{cursor:zoom-in;background:#fff;object-fit:cover;transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
.foto:hover{transform:scale(1.06);box-shadow:var(--shadow);position:relative;z-index:2}
#zoom{position:fixed;inset:0;z-index:100;background:rgba(6,12,10,.82);backdrop-filter:blur(4px);display:grid;place-items:center;padding:24px;cursor:zoom-out}
#zoom[hidden],[hidden]{display:none!important}
#zoom figure{margin:0;display:grid;gap:12px;justify-items:center;max-width:min(92vw,620px);animation:zoomin .35s cubic-bezier(.2,.8,.2,1.1)}
#zoom img{width:100%;height:auto;max-height:76vh;object-fit:contain;border-radius:18px;background:#fff}
#zoom figcaption{color:#fff;text-align:center;font-weight:600}
#zoom figcaption span{display:block;font-weight:400;opacity:.75;font-size:14px}
@keyframes zoomin{from{transform:scale(.85);opacity:.3}to{transform:none;opacity:1}}

/* inicio */
.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:36px;align-items:end;padding-block:18px 30px}
.hero h1{font-size:clamp(36px,6vw,72px);font-weight:800}
.hero h1 mark{background:var(--mark);color:var(--mark-ink);padding:0 .12em;border-radius:.12em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hero .lead{font-size:clamp(17px,1.6vw,20px);color:var(--muted);max-width:44ch;margin-top:18px}
.stamp{justify-self:end;width:min(100%,290px);aspect-ratio:1.45;border:2px dashed var(--accent);border-radius:18px;padding:18px;display:grid;align-content:space-between;transform:rotate(-3deg);color:var(--accent);background:var(--accent-soft)}
.stamp b{font:800 26px/1 var(--display)}
.stamp span{font:700 13px/1.3 var(--mono);letter-spacing:.04em}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi{padding:22px 18px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
.kpi .v{font:800 clamp(30px,4vw,46px)/1 var(--display);letter-spacing:-.02em}
.kpi .l{color:var(--muted);font-size:14px;margin-top:8px}
.sec{margin-top:56px}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.sec-h h2{font-size:clamp(26px,3vw,36px)}
.sec-h p{color:var(--muted);max-width:58ch}
.pasos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.paso{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;text-align:left;display:grid;gap:10px;align-content:start;transition:transform .25s,box-shadow .25s,border-color .25s}
.paso:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--accent)}
.paso .n{width:38px;height:38px;border-radius:12px;background:var(--accent);color:var(--surface);display:grid;place-items:center;font:800 18px var(--display)}
.paso h3{font-size:22px}
.paso p{color:var(--muted);font-size:15px}
.paso .ir{color:var(--accent);font-weight:700;font-size:14px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.catc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;text-align:left;transition:transform .25s,box-shadow .25s}
.catc:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.catc img{width:64px;height:64px;border-radius:14px;object-fit:cover;background:#fff}
.catc h3{font-size:18px}
.catc span{font-size:13px;color:var(--muted)}
.barras{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.barra{display:grid;grid-template-columns:230px 1fr 92px;gap:14px;align-items:center;font-size:15px;border:0;background:none;text-align:left;padding:4px;border-radius:10px}
.barra:hover{background:var(--surface2)}
.barra .t{height:14px;background:var(--surface2);border-radius:99px;overflow:hidden}
.barra .t i{display:block;height:100%;background:var(--accent);border-radius:99px;width:var(--w);transform-origin:left;animation:crece .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*50ms)}
@keyframes crece{from{transform:scaleX(.08)}to{transform:none}}
.barra .num{text-align:right;color:var(--muted)}

/* chips */
.chips{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.chip{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:99px;font-size:14px;font-weight:600;white-space:nowrap;transition:all .2s}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{font:600 12px var(--mono);opacity:.7;margin-left:4px}
.tend{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:13px;font-weight:700;white-space:nowrap}
.tend.sube{background:var(--up-bg);color:var(--up)}.tend.estable{background:var(--flat-bg);color:var(--flat)}
.tend.baja{background:var(--down-bg);color:var(--down)}.tend.quemado{background:var(--burn-bg);color:var(--burn)}
.tend.nuevo{background:var(--new-bg);color:var(--new)}.tend.sindato{background:var(--surface2);color:var(--muted)}
.pill{border:1px solid var(--line);padding:3px 10px;border-radius:99px;font-size:13px;color:var(--muted);white-space:nowrap}
.cod{background:var(--surface2);color:var(--muted);font:700 12px/1 var(--mono);padding:6px 9px;border-radius:7px}
.ben{display:inline-block;background:var(--mark);color:var(--mark-ink);font-weight:700;font-size:14px;padding:4px 10px;border-radius:8px;line-height:1.3}
.marca{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);font:800 13px/1 var(--display);letter-spacing:.02em;padding:7px 10px;border-radius:9px;text-transform:uppercase}
.marcas{display:flex;flex-wrap:wrap;gap:6px}
.ings{display:flex;flex-wrap:wrap;gap:6px}
.ings span{background:var(--surface2);border-radius:8px;padding:4px 9px;font-size:13px;line-height:1.35}

/* registros */
.cat-titulo{display:flex;align-items:baseline;gap:12px;margin:34px 0 14px;flex-wrap:wrap}
.cat-titulo h3{font-size:26px}
.cat-titulo span{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.reg{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:0;overflow:hidden;display:grid;grid-template-rows:auto 1fr;text-align:left;transition:transform .25s,box-shadow .25s,border-color .25s}
.reg:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.reg .portada{position:relative;background:#fff;display:grid;grid-template-columns:2fr 1fr;gap:2px;height:170px}
.reg .portada img{width:100%;height:100%;object-fit:contain;background:#fff}
.reg .portada .mini{display:grid;grid-template-rows:1fr 1fr;gap:2px;min-height:0}
.reg .portada .mini img{min-height:0}
.reg .portada .solo{grid-column:1/-1;min-height:0}
.reg .portada .cod{position:absolute;top:10px;left:10px;background:var(--ink);color:var(--bg);z-index:3}
.reg .cuerpo{padding:16px 18px 18px;display:grid;gap:12px;align-content:start}
.reg h3{font-size:20px}
.reg .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.reg .ventas{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.reg .ventas b{color:var(--ink);font-family:var(--mono)}
.reg .ver{color:var(--accent);font-weight:700;font-size:14px}
.lbl{font:700 11px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}

/* empaques (imagen de las 3 marcas) */
.reg .portada.e{display:block;height:auto;background:var(--surface2)}
.reg .portada.e .foto{width:100%;aspect-ratio:16/9;height:auto;object-fit:cover;display:block}
.basado{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.basado img{width:34px;height:34px;border-radius:8px;object-fit:cover;background:#fff;border:1px solid var(--line)}
.emp-grande{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:18px;border:1px solid var(--line)}
.ilustra{font-size:12px;color:var(--muted);margin-top:6px}

/* para mandar a hacer */
.mh{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:22px}
.mh > .izq{display:grid;gap:10px;align-content:start}
.mh .foto.grande{width:100%;aspect-ratio:16/9;height:auto;border-radius:16px;border:1px solid var(--line);object-fit:cover}
.mh .num{font:800 34px/1 var(--display);color:var(--accent)}
.mh h3{font-size:22px;margin:6px 0}
.mh .fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vende{display:grid;gap:8px}
.vende .p{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;font-size:13px}
.vende .p img{width:44px;height:44px;border-radius:10px;object-fit:cover;background:#fff;border:1px solid var(--line)}
.vende .p b{font-family:var(--mono)}
.tabla-ing{width:100%;border-collapse:collapse;font-size:14px}
.tabla-ing td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}
.tabla-ing td:first-child{font-weight:700;width:42%}
.tabla-ing tr:first-child td{border-top:0}
.dato{font-size:13px;color:var(--muted)}
.dato b{color:var(--ink)}
.estado{font:800 11px/1 var(--mono);letter-spacing:.06em;padding:6px 9px;border-radius:7px;text-transform:uppercase;background:var(--mark);color:var(--mark-ink)}
.estado.maneja{background:var(--ink);color:var(--bg)}
.estado.ranking{background:var(--accent-soft);color:var(--accent)}
@media (max-width:860px){.mh{grid-template-columns:1fr}}

/* prioridad */
.maneja{background:var(--ink);color:var(--bg);font:800 11px/1 var(--mono);letter-spacing:.06em;padding:6px 9px;border-radius:7px;text-transform:uppercase}
.reg.atenuado{opacity:.78}
.combo{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;width:76px;height:76px;border-radius:12px;overflow:hidden;background:var(--surface2)}
.combo img{width:100%;height:100%;object-fit:cover;background:#fff}
.prio{font:800 12px/1 var(--mono);color:var(--accent)}

/* marca del registro */
.mb{border-radius:22px;padding:16px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.mb .fotos{display:grid;grid-template-columns:1.25fr 1fr;grid-template-rows:auto auto;gap:10px}
.mb .fotos img{width:100%;border-radius:14px;cursor:zoom-in;display:block;object-fit:cover;background:#0002}
.mb .fotos .p{grid-row:span 2;aspect-ratio:4/5;height:100%}
.mb .fotos .v{aspect-ratio:9/12}
.mb .fotos .l{aspect-ratio:1/1}
.mb .txt{display:grid;gap:10px;align-content:start}
.mb .nm{font-size:42px;line-height:1;word-break:break-word}
.mb .es{font-size:18px;font-weight:700}
.mb p{font-size:14px;opacity:.9}
.mb small{font-size:13px;opacity:.8}
.mb .pal{display:flex;gap:6px}
.mb .pal i{width:22px;height:22px;border-radius:7px;border:1px solid #0002;display:inline-block}
.mb .otras{display:flex;gap:6px;flex-wrap:wrap}
.mb .otras span{font-size:12px;border:1px solid currentColor;border-radius:99px;padding:3px 9px;opacity:.75}
.mreg2{display:grid;gap:10px}
.mreg2 .arriba{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mreg2 h3{font-size:18px;margin:0;flex-basis:100%}
@media (max-width:860px){.mb{grid-template-columns:1fr}.mb .nm{font-size:34px}}

/* elegir nombres */
.vprog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px}
.vbar{flex:1;min-width:200px;height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.vbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.vlist{display:grid;gap:14px;margin-top:18px}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:12px}
.vcard.hecho{border-color:var(--accent)}
.vcard .arriba{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vcard h3{font-size:18px;margin:0;flex-basis:100%}
.vops{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.vop{text-align:left;border:1.5px solid var(--line);background:var(--surface2);border-radius:14px;padding:12px;display:grid;gap:6px;align-content:start;position:relative;transition:border-color .2s,transform .2s,background .2s;color:var(--ink)}
.vop:hover{transform:translateY(-2px);border-color:var(--muted)}
.vop[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.vop[aria-pressed="true"]::after{content:"✓";position:absolute;top:8px;right:10px;font-weight:800;color:var(--accent)}
.vop .nm{font:800 20px/1.05 var(--display);padding-right:16px;word-break:break-word}
.vop .es{font-size:13px;font-weight:600}
.vop small{font-size:12px;color:var(--muted)}
.vop .rec{justify-self:start;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink,#fff);padding:3px 8px;border-radius:99px}
.votro{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.votro input{flex:1;min-width:180px;max-width:360px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit}
.votro .estado-v{font-size:13px;color:var(--muted)}
@media (max-width:980px){.vops{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.vops{grid-template-columns:1fr}}

/* marcas únicas */
.marca.u{text-transform:none;letter-spacing:0;font-weight:400;font-size:15px;border:1px solid rgba(0,0,0,.08)}
.panel{width:100%;aspect-ratio:341/576;border-radius:12px;background-size:300% 100%;background-repeat:no-repeat;cursor:zoom-in;background-color:var(--surface2)}
.ureg{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:grid;gap:14px}
.ureg .arriba{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ureg h3{font-size:19px;margin:0}
.utrio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ucard{border-radius:18px;padding:10px 10px 14px;display:grid;gap:8px;align-content:start}
.ucard .nm{font-size:30px;line-height:1.05;word-break:break-word}
.ucard .es{font-size:14px;font-weight:600}
.ucard p,.ucard small{font-size:13px;opacity:.85}
.ulist{display:grid;gap:14px}
@media (max-width:760px){.utrio{grid-template-columns:1fr}.ucard{grid-template-columns:120px 1fr;align-items:start}.ucard .panel{grid-row:span 5}}

/* marcas */
.buscar{width:100%;max-width:420px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 16px;font:inherit}
.mreg{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:grid;grid-template-columns:minmax(0,380px) 1fr;gap:20px;align-items:center}
.mreg > .foto{width:100%;aspect-ratio:16/9;height:auto;border-radius:16px;border:1px solid var(--line)}
.mreg .arriba{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mreg h3{font-size:19px;margin:8px 0}
.mlist{display:grid;gap:12px}
.mreg .mcards{margin-top:10px}
.mreg .mcard{background:var(--surface2);border:0}

<header class="top">

</header>

<dialog id="modal" aria-labelledby="modal-titulo"></dialog>
<dialog id="guia" aria-labelledby="guia-titulo"></dialog>
<div id="zoom" hidden></div>

<script>
const D = /*__DATA__*/null;
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => (n == null ? '—' : Number(n).toLocaleString('es-CO'));
const PAIS = { US: 'EE. UU.', MX: 'México' };
const paises = (arr) => arr.map((r) => PAIS[r] || r).join(' y ');
const reducido = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TEND = { sube: '▲ Subiendo', estable: '● Estable', baja: '▼ Bajando', quemado: '✕ Quemado', nuevo: '✦ Nuevo', sindato: 'Sin dato' };
const tend = (t, c) => `<span class="tend ${t}" title="${c == null ? '' : 'Septiembre vs. agosto: ' + (c > 0 ? '+' : '') + c + ' %'}">${TEND[t]}${c != null && (t === 'sube' || t === 'baja' || t === 'quemado') ? ` <span class="mono">${c > 0 ? '+' : ''}${c}%</span>` : ''}</span>`;
const prodPorId = Object.fromEntries(D.productos.map((p) => [p.id, p]));
const regPorId = Object.fromEntries(D.registros.map((r) => [r.id, r]));
const catNombre = (cod) => D.categorias.find((c) => c.cod === cod)?.n || cod;
const foto = (id, alt = '', estilo = '') => (D.imgs[id] ? `<img class="foto" ${estilo ? `style="${estilo}"` : ''} src="${D.imgs[id]}" alt="${esc(alt)}" data-zoom="${id}" loading="lazy">` : '');
const fotoEmp = (id, cls = 'foto', alt = '') => (D.real && D.real[id] && D.cat[D.real[id]] ? `<img class="${cls}" src="${D.cat[D.real[id]].src}" alt="Foto real del producto" data-zoom="K:${D.real[id]}" loading="lazy">` : D.emp[id] ? `<img class="${cls}" src="${D.emp[id]}" alt="${esc(alt || 'Envase y foto de uso de la marca')}" data-zoom="E:${id}" loading="lazy">` : '');
const basado = (r) => `<div class="basado"><span>Basado en:</span>${r.refs.slice(0, 4).map((id) => (D.imgs[id] ? `<img src="${D.imgs[id]}" alt="${esc(prodPorId[id]?.n || '')}" data-zoom="${id}" class="foto">` : '')).join('')}</div>`;
const estiloMarca = (b) => (b.fuente ? `background:${b.fondo};color:${b.tinta};font-family:'${b.fuente}',var(--display)` : '');
const marcasHtml = (ms) => `<div class="marcas">${ms.map((b) => `<span class="marca u" style="${estiloMarca(b)}">${esc(b.nombre)}</span>`).join('')}</div>`;
const marcaBloque = (r, hl = esc) => {
  const b = r.marcas[0]; if (!b) return '';
  const im = (D.mv2 || {})[r.id] || {};
  const real = D.real && D.real[r.id] && D.cat[D.real[r.id]];
  const pack = real ? `<img class="p" src="${D.cat[D.real[r.id]].src}" alt="Foto real de ${esc(b.nombre)}" data-zoom="K:${D.real[r.id]}" loading="lazy">` : im.pack ? `<img class="p" src="${im.pack}" alt="Envase de ${esc(b.nombre)}" data-zoom="P:${r.id}" loading="lazy">` : '';
  const fotos = pack + (im.life ? `<img class="v" src="${im.life}" alt="${esc(b.nombre)} en uso" data-zoom="V:${r.id}" loading="lazy">` : '') + (im.logo ? `<img class="l" src="${im.logo}" alt="Logo de ${esc(b.nombre)}" data-zoom="L:${r.id}" loading="lazy">` : '');
  return `<div class="mb" style="background:${b.fondo || 'var(--surface2)'};color:${b.tinta || 'var(--ink)'}">
    <div class="fotos">${fotos}</div>
    <div class="txt"><span class="nm" style="font-family:'${b.fuente}',var(--display)">${hl(b.nombre)}</span>
      ${b.eslogan ? `<span class="es">"${esc(b.eslogan)}"</span>` : ''}
      ${b.por_que ? `<p><b>Por qué se llama así:</b> ${esc(b.por_que)}</p>` : ''}
      ${b.publico ? `<small><b>Para:</b> ${esc(b.publico)}</small>` : ''}
      ${b.inspiracion ? `<small><b>Estilo:</b> ${esc(b.inspiracion)}</small>` : ''}
      ${(b.paleta || []).length ? `<div class="pal">${b.paleta.map((h) => `<i style="background:${esc(h)}"></i>`).join('')}</div>` : ''}
      ${(b.otras || []).length ? `<small><b>Otras opciones de nombre:</b></small><div class="otras">${b.otras.map((o) => `<span>${esc(o)}</span>`).join('')}</div>` : ''}
    </div></div>`;
};
const POS = ['0%', '50%', '100%'];
const panel = (r, i) => (D.emp[r.id] ? `<div class="panel" style="background-image:url(${D.emp[r.id]});background-position:${POS[i]} 0" data-zoom="E:${r.id}" role="img" aria-label="Envase de ${esc(r.marcas[i]?.nombre || '')}"></div>` : '');
const tarjetaMarca = (r, b, i, hl = esc) => `<div class="ucard" style="background:${b.fondo || 'var(--surface2)'};color:${b.tinta || 'var(--ink)'}">${panel(r, i)}<span class="nm" style="font-family:'${b.fuente}',var(--display)">${hl(b.nombre)}</span>${b.eslogan ? `<span class="es">${esc(b.eslogan)}</span>` : ''}${b.descriptor ? `<small>${esc(b.descriptor)}</small>` : ''}<p>${esc(b.idea || '')}</p>${b.publico ? `<small>Para: ${esc(b.publico)}</small>` : ''}${b.inspiracion ? `<small>Estilo: ${esc(b.inspiracion)}</small>` : ''}</div>`;
const PLURAL = { 'Cápsula': 'Cápsulas', 'Cápsula blanda': 'Cápsulas blandas', 'Tableta': 'Tabletas', 'Gomita': 'Gomitas', 'Polvo': 'Polvos', 'Líquido': 'Líquidos', 'Gotas': 'Gotas', 'Sobre / stick': 'Sobres y sticks', 'Té': 'Tés', 'Otro': 'Otros' };

const estado = { tab: 'inicio', catMarca: D.categorias.find((c) => c.nr).cod, q: '', catReg: D.categorias.find((c) => c.nr).cod, catProd: D.categorias[0].cod, sinQuemados: false };
const leerG = () => { try { return JSON.parse(localStorage.getItem('planinvima2') || '{}'); } catch (e) { return {}; } };
estado.sinQuemados = !!leerG().sinQuemados;
const guardar = (extra = {}) => { try { localStorage.setItem('planinvima2', JSON.stringify({ ...leerG(), sinQuemados: estado.sinQuemados, ...extra })); } catch (e) {} };

/* ---------- INICIO ---------- */
function vistaInicio() {
  const k = D.kpi;
  const max = Math.max(...D.categorias.map((c) => c.total));
  return `<section class="hero">
    <div>
      <p class="eyebrow">Suplementos virales · TikTok Shop EE. UU. y México · ${esc(D.corte)}</p>
      <h1 style="margin-top:16px"><mark>${k.registros} registros</mark> para sacar de una vez.</h1>
      <p class="lead">Cada registro es una fórmula en una presentación (cápsula, gomita, polvo…) y lleva su propia marca. Aquí está qué registrar, con qué ingredientes y con qué nombres de marca.</p>
    </div>
    <div class="stamp" aria-hidden="true"><span>REGISTRO SANITARIO</span><b>1 FÓRMULA<br>= 3 MARCAS</b><span>${k.registros} REGISTROS · ${k.marcas} MARCAS</span></div>
  </section>
  <section class="kpis stag">
    ${[[k.registros, 'registros a sacar'], [k.marcas, 'marcas propias (una por producto)'], [k.productos, 'productos virales (sin repetidos)'], [k.unidades, 'unidades vendidas en septiembre']]
      .map(([v, l], i) => `<div class="kpi" style="--i:${i}"><div class="v mono" data-cuenta="${v}">${fmt(v)}</div><div class="l">${l}</div></div>`).join('')}
  </section>
  <section class="sec">
    <div class="sec-h"><h2>Cómo usar esta página</h2><p>Son tres secciones. Toque una para entrar.</p></div>
    <button class="paso" data-ir="mandar" style="--i:0;border-color:var(--accent);margin-bottom:16px;width:100%"><span class="n">★</span><h3>Para mandar a hacer</h3><p>La lista corta y directa: qué producto hacer, con qué ingredientes y dosis, cuánto vende hoy y con qué marcas. En orden de prioridad.</p><span class="ir">Ver la lista →</span></button>
    <div class="pasos stag">
      <button class="paso" data-ir="registros" style="--i:0"><span class="n">1</span><h3>Registros</h3><p>Lo que hay que registrar: para qué es cada producto, sus ingredientes, la presentación y su marca.</p><span class="ir">Ver los ${k.registros} registros →</span></button>
      <button class="paso" data-ir="marcas" style="--i:1"><span class="n">2</span><h3>Marcas</h3><p>Las ${k.marcas} marcas propias, una por producto, cada una con su nombre, eslogan, diseño y foto del envase.</p><span class="ir">Ver las marcas →</span></button>
      <button class="paso" data-ir="productos" style="--i:2"><span class="n">3</span><h3>Productos virales</h3><p>Lo que más se vende hoy en TikTok Shop, por categoría y presentación, con su tendencia y el registro en el que entra.</p><span class="ir">Ver los ${k.productos} productos →</span></button>
      <button class="paso" data-guia style="--i:3"><span class="n">?</span><h3>Fotos y guía</h3><p>Toque cualquier foto para verla en grande. Si se pierde, el botón "Guía" de arriba explica todo paso a paso.</p><span class="ir">Abrir la guía →</span></button>
    </div>
  </section>
  <section class="sec">
    <div class="sec-h"><h2>Registros por categoría</h2><p>Toque una categoría para ver sus registros.</p></div>
    <div class="cats stag">${D.categorias.filter((c) => c.nr).map((c, i) => { const r = D.registros.find((x) => x.cat === c.cod); const id = r && r.refs[0]; const src = r && D.emp[r.id] ? D.emp[r.id] : (id && D.imgs[id]); return `<button class="catc" data-catreg="${c.cod}" style="--i:${i}">${src ? `<img src="${src}" alt="">` : '<span></span>'}<div><h3>${esc(c.n)}</h3><span>${c.nr} ${c.nr === 1 ? 'registro' : 'registros'} · ${c.np} productos virales</span></div></button>`; }).join('')}</div>
  </section>
  <section class="sec">
    <div class="sec-h"><h2>Dónde está la demanda</h2><p>Unidades vendidas en septiembre de 2026 por categoría (EE. UU. + México). Toque una para ver sus productos.</p></div>
    <div class="barras">${D.categorias.map((c, i) => `<button class="barra" data-catprod="${c.cod}" style="--i:${i}"><span>${esc(c.n)}</span><span class="t"><i style="--w:${(c.total / max * 100).toFixed(1)}%"></i></span><span class="num mono">${fmt(c.total)}</span></button>`).join('')}</div>
  </section>`;
}

/* ---------- REGISTROS ---------- */
function tarjeta(r, i) {
  const [a, b, c] = r.refs;
  const n = (id) => prodPorId[id]?.n || '';
  const portada = D.emp[r.id] ? fotoEmp(r.id, 'foto', r.marcas.map((m) => m.nombre).join(', ')) : a ? (b ? `${foto(a, n(a))}<div class="mini">${foto(b, n(b))}${c ? foto(c, n(c)) : ''}</div>` : `<div class="solo">${foto(a, n(a))}</div>`) : '';
  const ing = r.ing.slice(0, 5);
  return `<article class="reg${r.nivel ? ' atenuado' : ''}" style="--i:${i}">
    <div class="portada${D.emp[r.id] ? ' e' : ''}">${portada}<span class="cod">${r.id}</span></div>
    <div class="cuerpo">
      <div><h3>${esc(r.n)}</h3>${r.ben ? `<div style="margin-top:8px"><span class="ben">${esc(r.ben)}</span></div>` : ''}</div>
      <div class="meta">${r.maneja ? `<span class="maneja">Ya lo manejan</span>` : ''}${r.quem && !r.maneja ? tend('quemado', null) : ''}<span class="pill">${esc(r.pres)}</span>${tend(r.t, r.crec)}</div>
      ${r.maneja ? `<p class="nota">${esc(r.maneja)}. Se muestra al final para no repetir lo que ya funciona.</p>` : ''}
      <div><p class="lbl">Ingredientes</p><div class="ings">${ing.map((x) => `<span>${esc(x)}</span>`).join('')}${r.ing.length > 5 ? `<span>+${r.ing.length - 5} más</span>` : ''}</div></div>
      <div><p class="lbl">Marcas propuestas</p>${marcasHtml(r.marcas)}</div>
      ${D.emp[r.id] ? basado(r) : ''}
      <div class="ventas"><span>EE. UU. <b>${fmt(r.us)}</b></span><span>México <b>${fmt(r.mx)}</b></span><span>${r.periodo ? 'u. en 28 días' : 'u. en sep'}</span></div>
      <button class="link ver" data-reg="${r.id}">Ver todo el registro →</button>
    </div>
  </article>`;
}
function vistaRegistros() {
  const cats = D.categorias.filter((c) => c.nr);
  const sel = estado.catReg;
  const lista = sel === 'todas' ? cats : cats.filter((c) => c.cod === sel);
  return `<div class="sec-h"><div><p class="eyebrow">Paso 1 · ${D.kpi.registros} registros · ${D.kpi.marcas} marcas</p><h2 style="margin-top:8px">Qué registrar, con qué ingredientes y con qué marcas</h2></div></div>
    <p class="nota"><b>Orden:</b> primero lo que más podría venderse (ventas de septiembre y tendencia); al final los quemados y lo que ya manejan. Cada tarjeta es un registro sanitario. La foto grande muestra el envase y la foto de uso de su marca (imagen ilustrativa); las fotos pequeñas son los productos reales en los que se basa. Toque cualquier foto para ampliarla. "Ver todo el registro" muestra la fórmula completa, las marcas y los productos en los que se basa.</p>

    </div>`;
  }).join('');
}
function vistaNombres() {
  const N = D.nombres || [];
  const hechos = N.filter((x) => (estado.votos || {})[x.reg]).length;

      <div class="chips" role="group" aria-label="Filtro"><button class="chip" data-fvoto="todos" aria-pressed="${estado.filtroVoto !== 'pend'}">Todos</button><button class="chip" data-fvoto="pend" aria-pressed="${estado.filtroVoto === 'pend'}">Sin elegir</button></div></div>
    ${estado.dbError ? '<p class="nota" style="color:var(--quem,#c0392b)">No se pudo guardar en línea; quedó guardado en este navegador.</p>' : ''}
    <div class="vlist" id="nombres-lista">${listaNombres()}</div>`;
}
function repintarNombres() {
  if (estado.tab !== 'nombres') return;
  const N = D.nombres || []; const hechos = N.filter((x) => (estado.votos || {})[x.reg]).length;
  const c = $('#v-cuenta'), b = $('#v-barra'), l = $('#nombres-lista');
  if (!c || !l) return pintar();
  c.textContent = hechos + ' de ' + N.length + ' elegidos'; b.style.width = (N.length ? (hechos / N.length) * 100 : 0) + '%';
  const foco = document.activeElement && document.activeElement.id; const pos = foco && document.activeElement.selectionStart;
  l.innerHTML = listaNombres();
  if (foco && foco.startsWith('otro-') && $('#' + foco)) { const el = $('#' + foco); el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} }
}
let dbVotos = null;
async function votar(reg, data) {
  estado.votos = { ...(estado.votos || {}), [reg]: { ...data, en: new Date().toISOString() } };
  repintarNombres();
  if (dbVotos) { try { await dbVotos.doc('elecciones/' + reg).set(estado.votos[reg]); return; } catch (e) { estado.dbError = true; } }
  guardar({ votos: estado.votos });
}
(async () => {
  try {
    const db = window.claude && window.claude.use ? await window.claude.use('db') : null;
    if (!db) return;
    dbVotos = db;
    db.collection('elecciones').onSnapshot((s) => {
      const v = {}; s.docs.forEach((d) => { const x = d.data(); if (x) v[d.id] = x; });
      estado.votos = v; estado.dbOk = true;
      if (estado.tab === 'nombres') repintarNombres();
    }, () => { dbVotos = null; });
  } catch (e) {}
})();

/* ---------- PRODUCTOS ---------- */
function vistaProductos() {
  const cat = D.categorias.find((c) => c.cod === estado.catProd) || D.categorias[0];
  let ps = D.productos.filter((p) => p.cat === cat.cod);
  const quemados = ps.filter((p) => p.t === 'quemado').length;
  if (estado.sinQuemados) ps = ps.filter((p) => p.t !== 'quemado');
  // lo que ya manejan (p. ej. magnesio complex) se une en una sola tarjeta al final
  const yaIds = new Set(D.registros.filter((r) => r.maneja).map((r) => r.id));
  const ya = ps.filter((p) => yaIds.has(p.f));
  ps = ps.filter((p) => !yaIds.has(p.f));
  const grupos = {}; ps.forEach((p) => (grupos[p.v] ||= []).push(p));
  const combos = [...yaIds].map((id) => ({ r: regPorId[id], ps: ya.filter((p) => p.f === id) })).filter((c) => c.ps.length);
  const suma = (a) => a.reduce((s, p) => s + (p.u || 0), 0);
  const maxU = Math.max(1, ...ps.map((p) => p.u || 0));
  return `<div class="sec-h"><div><p class="eyebrow">Paso 2 · ${D.kpi.productos} productos sin repetidos</p><h2 style="margin-top:8px">Lo que más se vende en TikTok Shop</h2></div></div>
    <div class="chips" role="group" aria-label="Categoría">${D.categorias.filter((c) => c.np).map((c) => `<button class="chip" data-catprod="${c.cod}" aria-pressed="${c.cod === cat.cod}">${esc(c.n)}<small>${c.np}</small></button>`).join('')}</div>
    <section class="cat-head">
      <p class="eyebrow">Categoría</p><h2>${esc(cat.n)}</h2>
      ${cat.problema ? `<p class="nota" style="font-size:16px;max-width:70ch">${esc(cat.problema)}</p>` : ''}
      <div class="stats"><div><b class="mono">${fmt(cat.total)}</b><span>unidades en septiembre</span></div><div><b class="mono">${cat.np}</b><span>productos</span></div><div><b class="mono">${cat.nr}</b><span>registros</span></div><div><b class="mono">${quemados}</b><span>quemados</span></div></div>
    </section>
    <div class="sec-h" style="margin-top:22px;margin-bottom:0"><p class="nota">Agrupados por presentación y ordenados por prioridad: primero lo que más vende y crece, al final los quemados. Si un producto se vende en varias publicaciones, aparece una sola vez con las ventas sumadas. "Quemado" = cae más de 20 % y lleva más de un año en venta.</p>
      <label class="toggle"><input type="checkbox" id="sin-quemados" ${estado.sinQuemados ? 'checked' : ''}> Ocultar quemados</label></div>
    ${Object.keys(grupos).sort((a, b) => suma(grupos[b]) - suma(grupos[a])).map((v) => `<div class="grupo"><div class="grupo-h"><h3>${esc(PLURAL[v] || v)}</h3><span>${grupos[v].length}</span></div>
      <div class="lista stag">${grupos[v].sort((a, b) => a.nivel - b.nivel || b.score - a.score).map((p, i) => {
        const r = p.f ? regPorId[p.f] : null;
        return `<div class="item" style="--i:${i}">${foto(p.id, p.n)}
          <div class="n1"><div class="nom">${esc(p.n)}</div><div class="sub">${esc(p.m)} · ${paises(p.paises)}</div>${p.s ? `<div style="margin-top:6px"><span class="ben" style="font-size:12.5px;padding:3px 8px">${esc(p.s)}</span></div>` : ''}${p.pubs > 1 ? `<span class="dup">${p.pubs} publicaciones unidas</span>` : ''}</div>
          <div class="u"><span class="mono">${p.u != null ? fmt(p.u) + ' u.' : p.w != null ? fmt(p.w) + ' u./sem' : '—'}</span><span class="t"><i style="--w:${((p.u || 0) / maxU * 100).toFixed(1)}%"></i></span></div>
          <div class="tcol">${tend(p.t, p.c)}</div>
          <div class="reg-link">${r ? `<span>Registro <button class="link" data-reg="${r.id}">${r.id} · ${esc(r.n)}</button></span>${marcasHtml(r.marcas)}` : ''}</div>

      <div class="n1"><div class="nom">${esc(c.r.maneja)}</div><div class="sub">Todos los ${esc(c.r.n.toLowerCase())} virales juntos: ${c.ps.map((p) => esc(p.n)).join(' · ')}</div></div>
      <div class="u"><span class="mono">${fmt(c.ps.reduce((s, p) => s + (p.u || 0), 0))} u.</span></div>
      <div class="tcol">${tend(c.r.t, c.r.crec)}</div>
      <div class="reg-link"><span>Registro <button class="link" data-reg="${c.r.id}">${c.r.id} · ${esc(c.r.n)}</button></span>${marcasHtml(c.r.marcas)}</div>
    </div></div></div>`).join('')}`;
}

const PASOS = [
  { t: 'Bienvenido. Esto es lo que va a ver', p: `Analizamos los suplementos más vendidos de TikTok Shop en EE. UU. y México y los agrupamos en ${D.kpi.registros} registros sanitarios para sacar de una vez.`, ilus: `<div class="fila"><span class="cod">1 registro</span> = <span class="pill">1 fórmula</span> + <span class="pill">1 presentación</span> = <span class="marca">1 marca</span></div><p class="nota">Una misma fórmula en cápsula y en gomita son dos registros distintos.</p>` },
  { t: 'Empiece aquí: Para mandar a hacer', p: 'Es la lista corta para el maquilador. Cada producto dice qué se vende hoy y cuánto, el producto que se hace, los ingredientes con dosis y sus marcas, en orden de prioridad.', ilus: `<div class="fila"><span class="estado">Línea propia</span><span class="estado maneja">Ya lo manejan</span><span class="estado ranking">Del ranking</span></div>` },
  { t: 'Paso 1: Registros', p: 'Cada tarjeta es un registro. Arriba ve el envase y la foto de uso de su marca, y abajo los productos reales en los que se basa. Debajo: para qué es, la presentación, los ingredientes y la marca.', ilus: `<div class="fila"><span class="cod">${r0.id}</span><b>${esc(r0.n)}</b></div><div class="fila"><span class="ben">${esc(r0.ben)}</span><span class="pill">${esc(r0.pres)}</span></div>${marcasHtml(r0.marcas)}` },
  { t: 'Toque "Ver todo el registro"', p: 'Se abre la ficha completa: la lista de ingredientes con dosis típicas, la marca con su logo, envase y foto de uso, los productos reales en los que se basa y cuánto venden.', ilus: `<ul class="check">${r0.ing.slice(0, 4).map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` },
  { t: 'Paso 2: Marcas', p: 'Cada producto es su propia marca, con su nombre, eslogan, colores y envase. Cada producto tiene su propia marca con logo, envase y foto de uso. Puede buscar una marca por su nombre o filtrar por categoría.', ilus: `<div class="mcards">${r0.marcas.map((b) => `<div class="mcard" style="background:${b.fondo};color:${b.tinta}"><span class="nm" style="font-size:22px;color:inherit;text-transform:none;font-family:'${b.fuente}',var(--display)">${esc(b.nombre)}</span></div>`).join('')}</div>` },
  { t: 'Paso 3: Productos virales', p: 'Lo que más se vende hoy, por categoría y por presentación (cápsulas, gomitas, polvos…). Cada producto dice para qué es, si va subiendo o bajando y en qué registro entra.', ilus: `<div class="fila">${tend('sube', 34)}${tend('estable', null)}${tend('baja', -18)}${tend('quemado', -31)}${tend('nuevo', null)}</div><p class="nota">"Quemado" = vende cada vez menos y ya lleva más de un año. Mejor no inspirarse en esos.</p>` },
  { t: 'Las fotos se amplían', p: 'Toque cualquier foto para verla en grande. Toque otra vez (o fuera de la foto) para cerrarla. Puede volver a esta guía cuando quiera con el botón "Guía" de arriba.', ilus: `<div class="fila">${r0.refs.slice(0, 3).map((id) => foto(id, prodPorId[id].n, 'width:96px;height:96px;border-radius:14px')).join('')}</div>` },
];
let pasoGuia = 0;
function pintarGuia() {
  const s = PASOS[pasoGuia];
  $('#guia').innerHTML = `<div class="guia guia-anim"><button class="cerrar" aria-label="Cerrar guía" data-cerrar-guia>×</button>
    <p class="paso-n">${pasoGuia + 1} de ${PASOS.length}</p><h2 id="guia-titulo">${esc(s.t)}</h2><p>${esc(s.p)}</p>
    <div class="ilus">${s.ilus}</div>
    <div class="pie"><div class="puntos">${PASOS.map((_, i) => `<i class="${i === pasoGuia ? 'on' : ''}"></i>`).join('')}</div>
      <div style="display:flex;gap:8px;align-items:center">${pasoGuia > 0 ? '<button class="btn sec" data-guia-paso="-1">Atrás</button>' : ''}<button class="btn" data-guia-paso="1">${pasoGuia < PASOS.length - 1 ? 'Siguiente' : 'Empezar'}</button></div></div></div>`;
}
function abrirGuia() { pasoGuia = 0; pintarGuia(); if (!$('#guia').open) $('#guia').showModal(); }

/* ---------- zoom ---------- */
const grandes = {};
const cargarGrandes = (archivo) => (grandes[archivo] ||= fetch(archivo).then((x) => (x.ok ? x.json() : {})).catch(() => ({})));
function ampliar(clave) {
  if (/^[LPV]:/.test(clave)) {
    const tipo = { L: 'logo', P: 'pack', V: 'life' }[clave[0]]; const id = clave.slice(2); const reg = regPorId[id];
    const src = ((D.mv2 || {})[id] || {})[tipo]; if (!src || !reg) return;
    const z1 = $('#zoom'); const b = reg.marcas[0] || {};
    z1.innerHTML = '<figure style="max-width:min(94vw,760px)"><img src="' + src + '" alt="' + esc(b.nombre || '') + '"><figcaption>' + esc(b.nombre || '') + '<span>' + esc({ logo: 'Logo e identidad', pack: 'Envase', life: 'Foto de uso' }[tipo]) + ' · Registro ' + reg.id + ' · ' + esc(reg.n) + ' · imagen ilustrativa</span></figcaption></figure>';
    const ab = document.querySelector('dialog[open]'); (ab || document.body).appendChild(z1); z1.hidden = false;
    cargarGrandes('grandes_' + tipo + '.json').then((g) => { const im = z1.querySelector('img'); if (g[clave] && im && !z1.hidden) im.src = g[clave]; });
    return;
  }
  if (clave.startsWith('K:')) { const k = clave.slice(2); const c = D.cat[k]; if (!c) return; const z0 = $('#zoom'); z0.innerHTML = '<figure><img src="' + c.src + '" alt="' + esc(c.nombre) + '"><figcaption>' + esc(c.nombre) + '<span>Foto del producto en Dropi</span></figcaption></figure>'; const ab = document.querySelector('dialog[open]'); (ab || document.body).appendChild(z0); z0.hidden = false; cargarGrandes('grandes_empaques.json').then((g) => { const im = z0.querySelector('img'); if (g[clave] && im && !z0.hidden) im.src = g[clave]; }); return; }
  const esEmp = clave.startsWith('E:'); const id = esEmp ? clave.slice(2) : clave;
  const src = esEmp ? D.emp[id] : D.imgs[id]; if (!src) return;
  const p = esEmp ? null : prodPorId[id]; const reg = esEmp ? regPorId[id] : null;
  const titulo = esEmp ? (reg ? reg.marcas.map((m) => m.nombre).join(' · ') : '') : (p?.n || '');
  const sub = esEmp ? (reg ? 'Registro ' + reg.id + ' · ' + reg.n + (reg.catalogo ? ' · foto del producto' : ' · imagen ilustrativa') : '') : (p?.m || '') + (p ? ' · ' + paises(p.paises) : '');
  const z = $('#zoom');
  z.innerHTML = '<figure' + (esEmp ? ' style="max-width:min(94vw,1000px)"' : '') + '><img src="' + src + '" alt="' + esc(titulo) + '"><figcaption>' + esc(titulo) + '<span>' + esc(sub) + '</span></figcaption></figure>';
  cargarGrandes(esEmp ? 'grandes_empaques.json' : 'grandes_productos.json').then((g) => { const img = z.querySelector('img'); if (g[id] && img && !z.hidden) img.src = g[id]; });
  // el visor va encima de cualquier ventana abierta
  const abierto = document.querySelector('dialog[open]');
  (abierto || document.body).appendChild(z);
  z.hidden = false;
}

/* ---------- navegación ---------- */
function pintar() {
  document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', t.dataset.tab === estado.tab));
  $('#app').innerHTML = `<div class="view">${{ inicio: vistaInicio, mandar: vistaMandar, nombres: vistaNombres, registros: vistaRegistros, marcas: vistaMarcas, productos: vistaProductos }[estado.tab]()}</div>`;
  if (!reducido) contar();
}
function ir(tab, extra = {}) {
  Object.assign(estado, extra, { tab });
  try { history.replaceState(null, '', '#' + tab); } catch (e) {}
  pintar(); scrollTo({ top: 0, behavior: reducido ? 'auto' : 'smooth' });
}
function contar() {
  document.querySelectorAll('[data-cuenta]').forEach((el) => {
    const fin = +el.dataset.cuenta, ini = fin * 0.55, t0 = performance.now();
    const paso = (t) => { const k = Math.min(1, (t - t0) / 900); el.textContent = fmt(Math.round(ini + (fin - ini) * (1 - Math.pow(1 - k, 3)))); if (k < 1) requestAnimationFrame(paso); };
    requestAnimationFrame(paso);
  });
}
const cerrarZoom = () => { const z = $('#zoom'); z.hidden = true; document.body.appendChild(z); };
document.addEventListener('click', (e) => {
  if (e.target.closest('#zoom')) return cerrarZoom();
  const z = e.target.closest('[data-zoom]');
  if (z) { e.preventDefault(); e.stopPropagation(); return ampliar(z.dataset.zoom); }
  const t = e.target.closest('button, a'); if (!t) return;
  if (t.matches('[data-cerrar]')) return $('#modal').close();
  if (t.matches('[data-cerrar-guia]')) { guardar({ guiaVista: true }); return $('#guia').close(); }
  if (t.id === 'abrir-guia' || t.hasAttribute('data-guia')) return abrirGuia();
  if (t.dataset.guiaPaso) { const n = pasoGuia + +t.dataset.guiaPaso; if (n >= PASOS.length) { guardar({ guiaVista: true }); $('#guia').close(); return ir('registros'); } pasoGuia = Math.max(0, n); return pintarGuia(); }
  if (t.dataset.voto) return votar(t.dataset.voto, { i: +t.dataset.i, propio: '' });
  if (t.dataset.otro) { const val = ($('#otro-' + t.dataset.otro) || {}).value || ''; if (val.trim()) votar(t.dataset.otro, { i: -1, propio: val.trim().slice(0, 60) }); return; }
  if (t.dataset.fvoto) { estado.filtroVoto = t.dataset.fvoto; return pintar(); }
  if (t.dataset.tab) return ir(t.dataset.tab);
  if (t.dataset.ir) return ir(t.dataset.ir);
  if (t.dataset.reg) { if ($('#guia').open) $('#guia').close(); return abrirRegistro(t.dataset.reg); }
  if (t.dataset.catreg) return ir('registros', { catReg: t.dataset.catreg });
  if (t.dataset.catmarca) return ir('marcas', { catMarca: t.dataset.catmarca, q: '' });
  if (t.dataset.catprod) { if ($('#modal').open) $('#modal').close(); return ir('productos', { catProd: t.dataset.catprod }); }
}, true);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#zoom').hidden) { e.preventDefault(); cerrarZoom(); } });
document.addEventListener('input', (e) => {
  if (e.target.id !== 'buscar-marca') return;
  estado.q = e.target.value;
  const tmp = document.createElement('div'); tmp.innerHTML = vistaMarcas();
  $('#marcas-lista').replaceWith(tmp.querySelector('#marcas-lista'));
});
document.addEventListener('change', (e) => { if (e.target.id === 'sin-quemados') { estado.sinQuemados = e.target.checked; guardar(); pintar(); } });
$('#modal').addEventListener('click', (e) => { if (e.target === e.currentTarget) e.currentTarget.close(); });
$('#guia').addEventListener('click', (e) => { if (e.target === e.currentTarget) { guardar({ guiaVista: true }); e.currentTarget.close(); } });
// miniaturas de las marcas (logo, envase y foto de uso): archivo aparte para que la página abra rápido
D.mv2 = {};
fetch('marcas_mini.json').then((x) => (x.ok ? x.json() : {})).catch(() => ({})).then((m) => {
  D.mv2 = m || {};
  if (estado.tab === 'marcas') { const tmp = document.createElement('div'); tmp.innerHTML = vistaMarcas(); const l = $('#marcas-lista'); if (l) l.replaceWith(tmp.querySelector('#marcas-lista')); }
  const dlg = $('#modal'); if (dlg.open && dlg.dataset.reg) { const id = dlg.dataset.reg; dlg.close(); abrirRegistro(id); }
});
const inicial = (location.hash || '').slice(1);
if (['inicio', 'mandar', 'nombres', 'registros', 'marcas', 'productos'].includes(inicial)) estado.tab = inicial;
estado.votos = estado.votos || leerG().votos || {};
$('#pie').innerHTML = `Datos de ventas: FastMoss (TikTok Shop EE. UU. y México), ${esc(D.corte)}. Fórmulas con dosis típicas del mercado. Nombres de marca propuestos: verificar disponibilidad en la SIC antes de registrarlos.`;
pintar();
if (!leerG().guiaVista) setTimeout(abrirGuia, 600);
</script>
